name: Build APK

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Export build configuration
        shell: bash
        run: buildscripts/include/ci.sh export >> "$GITHUB_ENV"

      - name: Restore native dependency cache
        uses: actions/cache@v4
        with:
          path: gh-cache
          key: ${{ runner.os }}-${{ env.CACHE_IDENTIFIER }}

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            autoconf \
            gperf \
            libtool \
            nasm \
            ninja-build \
            pkgconf

      - name: Install current Meson
        run: |
          python -m pip install --upgrade "meson>=1.11.0,<2"
          meson --version

      - name: Prepare Android SDK and native dependencies
        env:
          CACHE_MODE: folder
          CACHE_FOLDER: ${{ github.workspace }}/gh-cache
        run: |
          mkdir -p "$CACHE_FOLDER"
          buildscripts/include/ci.sh install

      - name: Build APKs
        run: buildscripts/include/ci.sh build

      - name: Upload universal APKs
        uses: actions/upload-artifact@v4
        with:
          name: mpv-dufs-universal-debug
          path: app/build/outputs/apk/*/debug/*-universal-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload ABI APKs
        uses: actions/upload-artifact@v4
        with:
          name: mpv-dufs-abi-debug
          path: |
            app/build/outputs/apk/*/debug/*-armeabi-v7a-debug.apk
            app/build/outputs/apk/*/debug/*-arm64-v8a-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
