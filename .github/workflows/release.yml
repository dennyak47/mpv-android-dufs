name: release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag name to create or update on manual runs
        required: true
        type: string
      publish_github_release:
        description: Publish a GitHub release with the generated artifacts
        required: true
        default: true
        type: boolean
      publish_to_play:
        description: Upload the signed app bundle to Google Play
        required: true
        default: false
        type: boolean
      play_track:
        description: Google Play track to upload to
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      - name: Export env vars
        run: buildscripts/include/ci.sh export >>"$GITHUB_ENV"

      - uses: actions/cache@v6
        with:
          path: gh-cache/
          key: "${{ env.CACHE_IDENTIFIER }}"
          enableCrossOsArchive: true

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install autoconf pkgconf libtool ninja-build python3-pip gperf nasm
          sudo pip3 install meson

      - name: Install SDK and native dependencies
        run: |
          mkdir -p "$CACHE_FOLDER"
          buildscripts/include/ci.sh install
        env:
          CACHE_MODE: folder
          CACHE_FOLDER: "${{ github.workspace }}/gh-cache"

      - name: Decode signing key
        run: |
          printf '%s' "${{ secrets.ANDROID_SIGNING_KEY_B64 }}" | base64 -d >"$RUNNER_TEMP/android-signing-key.jks"

      - name: Build signed release artifacts
        run: buildscripts/include/ci.sh build
        env:
          CACHE_MODE: folder
          CACHE_FOLDER: "${{ github.workspace }}/gh-cache"
          ANDROID_SIGNING_KEY: "${{ runner.temp }}/android-signing-key.jks"
          ANDROID_SIGNING_ALIAS: "${{ secrets.ANDROID_SIGNING_ALIAS }}"
          ANDROID_SIGNING_KEY_PASSWORD: "${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}"
          ANDROID_SIGNING_ALIAS_PASSWORD: "${{ secrets.ANDROID_SIGNING_ALIAS_PASSWORD }}"

      - name: Prepare release artifacts
        run: |
          docs/prepare_artifacts.sh
          docs/print_releasenotes.sh >output/release-notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: release-artifacts-${{ env.RELEASE_TAG }}
          path: output/
          if-no-files-found: error

      - name: Create or update GitHub release
        if: github.event_name == 'push' || inputs.publish_github_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ env.RELEASE_TAG }}"
          target_commitish: "${{ github.sha }}"
          body_path: output/release-notes.md
          files: |
            output/github/*
            output/googleplay/*.aab
            output/googleplay/*.zip

      - name: Upload bundle to Google Play
        if: inputs.publish_to_play
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: "${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}"
          packageName: is.xyz.mpv
          releaseFiles: app/build/outputs/bundle/defaultRelease/app-default-release-signed.aab
          track: "${{ inputs.play_track }}"
